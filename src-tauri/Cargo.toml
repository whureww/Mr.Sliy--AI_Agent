[package]
name = "mrsliy-desktop"
version = "0.1.9"
description = "MR·SLIY 多语言代码优化智能体 · 桌面端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# custom-protocol 必须默认启用：tauri crate 仅在该 feature 下嵌入前端资源；
# 否则（即使 release 构建）exe 会回落加载 devUrl（localhost:5173）导致窗口显示"localhost 拒绝连接"。
# debug 下同样嵌入 dist 资源（本项目开发流程不依赖 vite 热更新）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
encoding_rs = "0.8"
chardetng = "0.1"

[profile.release]
opt-level = "s"
lto = true
